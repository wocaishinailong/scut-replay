[project]
name = "scut-replay"
version = "0.1.0"
description = "Local, incremental SCUT replay collection and transcription"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.50,<2",
  "httpx>=0.27,<1",
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=2,<3",
  "silero-vad>=6,<7",
  "mlx-whisper>=0.4,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
scut-replay = "scut_replay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scut_replay"]
